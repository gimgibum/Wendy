<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wendy - 캘린더</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/modal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="screen">

    <!-- 캘린더 화면 -->
    <div id="calendar-view">
      <div class="legend" id="legend"></div>

      <div class="calendar-grid" id="calendar-grid"></div>

      <div class="calendar-footer">
        <button class="logout-btn" id="logout-btn">로그아웃</button>
        <button class="secondary-btn" id="add-event-btn">일정 추가</button>
      </div>
    </div>

    <!-- 일정 추가 화면 -->
    <div id="add-event-view" class="hidden">
      <div class="page-header">
        <button class="back-btn" id="back-btn" aria-label="뒤로가기">←</button>
        <h1>일정 추가</h1>
      </div>
            <div class="field-group">
        <div class="field-label">날짜</div>
        <div class="field-box">
          <span class="field-icon"></span>
          <input type="date" id="event-date" />
        </div>

        <div class="field-label">시간</div>
        <div class="field-box">
          <span class="field-icon"></span>
          <input type="time" id="event-time" placeholder="시간 선택 (선택)" />
        </div>

        <div class="field-label">제목</div>
        <div class="field-box">
          <input type="text" id="event-title" placeholder="예: 저녁 약속" />
        </div>

        <div class="field-label">메모 (선택)</div>
        <div class="field-box">
          <textarea id="event-memo" rows="2" placeholder="장소 등 자유롭게"></textarea>
        </div>

        <div class="field-label">내 색상</div>
        <div class="color-display">
          <span class="legend-dot" id="my-color-dot"></span>
          <span id="my-color-name"></span>
        </div>
      </div>

      <div class="footer-area">
        <button class="primary-btn" id="save-event-btn">저장하기</button>
      </div>
    </div>

  </div>
 <script type="module">
    import { renderCalendar, getColorClass, toDateKey } from "./js/calendar.js";
    import { requireLogin, signOut } from "./js/auth.js";
    import { getMyEvents, createEvent } from "./js/db.js";

    const user = requireLogin();

    // 그룹 참여자 목록 (그룹에 가입하기 전까지는 비어있음)
    const members = [];
    // 로그인한 나 자신의 색상 (그룹 가입 전 임시 기본값)
    const currentMember = { id: "me", name: "나", color: "red" };

    // 학사일정 (학교 등록 후 자동으로 채워짐)
    const schoolEvents = loadSchoolEvents();
    // DB 에 저장된 내 일정
    let myEvents = [];

    // 온보딩에서 불러온 학사일정 (sessionStorage 에 저장되어 있음)
    function loadSchoolEvents() {
      try {
        return JSON.parse(sessionStorage.getItem("schoolEvents")) || [];
      } catch {
        return [];
      }
    }

    // DB 에서 받은 일정을 캘린더 표시 형식으로 변환 (시간은 'HH:MM:SS' → 'HH:MM')
    function toCalendarEvent(row) {
      return {
        ...row,
        time: row.time ? row.time.slice(0, 5) : null,
        color: currentMember.color,
      };
    }

    async function loadMyEvents() {
      try {
        const rows = await getMyEvents();
        myEvents = rows.map(toCalendarEvent);
        drawCalendar();
      } catch (err) {
        // 28000 = 로그인 만료 → 이미 로그인 화면으로 이동 중
        if (err.code !== "28000") alert("일정을 불러오지 못했어요. 새로고침해주세요");
      }
    }

    const calendarView = document.getElementById("calendar-view");
    const addEventView = document.getElementById("add-event-view");
    const grid = document.getElementById("calendar-grid");
    const legend = document.getElementById("legend");

    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth();

    function drawLegend() {
      legend.innerHTML = "";
      members.forEach((member) => {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `<span class="legend-dot ${getColorClass(member.color)}"></span><span>${member.name}</span>`;
        legend.appendChild(item);
      });
    }
    function drawCalendar() {
      const events = [...schoolEvents, ...myEvents];
      renderCalendar(grid, currentYear, currentMonth, events, (dateKey) => {
        openAddEventView(dateKey);
      });
    }

    function openAddEventView(dateKey) {
      // toISOString 은 UTC 기준이라 한국 시간 오전 9시 전에는 어제 날짜가 됨 → 로컬 날짜 사용
      const now = new Date();
      const dateToUse = dateKey || toDateKey(now.getFullYear(), now.getMonth(), now.getDate());
      document.getElementById("event-date").value = dateToUse;
      document.getElementById("event-time").value = "";
      document.getElementById("event-title").value = "";
      document.getElementById("event-memo").value = "";

      const dot = document.getElementById("my-color-dot");
      dot.className = `legend-dot ${getColorClass(currentMember.color)}`;
      document.getElementById("my-color-name").textContent = currentMember.name;

      calendarView.classList.add("hidden");
      addEventView.classList.remove("hidden");
    }

    function closeAddEventView() {
      addEventView.classList.add("hidden");
      calendarView.classList.remove("hidden");
    }

    document.getElementById("add-event-btn").addEventListener("click", () => {
      openAddEventView();
    });

    document.getElementById("back-btn").addEventListener("click", closeAddEventView);

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await signOut();
      window.location.href = "index.html";
    });

    const saveEventBtn = document.getElementById("save-event-btn");
    saveEventBtn.addEventListener("click", async () => {
      const date = document.getElementById("event-date").value;
      const time = document.getElementById("event-time").value;
      const title = document.getElementById("event-title").value.trim();
      const memo = document.getElementById("event-memo").value.trim();

      if (!date || !title) {
        alert("날짜와 제목을 입력해주세요");
        return;
      }

      saveEventBtn.disabled = true;
      try {
        const saved = await createEvent({
          title,
          date,
          time: time || null,
          memo: memo || null,
        });
        myEvents.push(toCalendarEvent(saved));
        drawCalendar();
        closeAddEventView();
      } catch (err) {
        if (err.code !== "28000") alert("일정을 저장하지 못했어요. 다시 시도해주세요");
      } finally {
        saveEventBtn.disabled = false;
      }
    });

    drawLegend();
    drawCalendar();
    if (user) loadMyEvents();
  </script>

</body>

</html>
