<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wendy - 로그인</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, "Malgun Gothic", sans-serif;
        }
        
        body {
            background: #F5F5F7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 400px;
            width: 100%;
            margin: 16px;
        }
        
        .title-area {
            text-align: center;
            margin-bottom: 26px;
        }
        
        .title-area h1 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .title-area p {
            font-size: 12px;
            color: #8A8A8E;
        }
        
        .field {
            border: 1px solid #E5E5E7;
            border-radius: 8px;
            padding: 11px 12px;
            margin-bottom: 12px;
        }
        
        .field input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 13px;
            background: transparent;
        }
        
        .error-msg {
            color: #D85A30;
            font-size: 12px;
            margin: -4px 0 12px 2px;
            min-height: 14px;
        }

        .error-msg.success {
            color: #3348FF;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #3348FF;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            margin-bottom: 14px;
        }
        
        .submit-btn:disabled {
            background: #B7BEFF;
            cursor: not-allowed;
        }
        
        .switch-text {
            text-align: center;
            font-size: 12px;
            color: #8A8A8E;
        }
        
        .switch-text span {
            color: #3348FF;
            font-weight: 500;
            cursor: pointer;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- 로그인 -->
        <div id="login-form">
            <div class="title-area">
                <h1>Login</h1>

            </div>

            <div class="field">
                <input type="text" id="login-username" placeholder="아이디" />
            </div>
            <div class="field">
                <input type="password" id="login-password" placeholder="비밀번호" />
            </div>
            <div class="error-msg" id="login-error"></div>

            <button class="submit-btn" id="login-btn">로그인</button>
            <div class="switch-text">
                계정이 없으신가요? <span id="go-signup">회원가입</span>
            </div>
        </div>

        <!-- 회원가입-->
        <div id="signup-form" class="hidden">
            <div class="title-area">
                <h1>회원가입</h1>
            </div>

            <div class="field">
                <input type="text" id="signup-username" placeholder="아이디" />
            </div>
            <div class="field">
                <input type="password" id="signup-password" placeholder="비밀번호" />
            </div>
            <div class="field">
                <input type="password" id="signup-password-confirm" placeholder="비밀번호 확인" />
            </div>
            <div class="error-msg" id="signup-error"></div>

            <button class="submit-btn" id="signup-btn">회원가입</button>
            <div class="switch-text">
                이미 계정이 있으신가요? <span id="go-login">로그인</span>
            </div>
        </div>

    </div>
    <script type="module">
      import { signIn, signUp, getCurrentUser } from './js/auth.js';

      // 1. 이미 로그인되어 있으면 바로 캘린더로 이동
      if (getCurrentUser()) {
        window.location.replace('calendar.html');
      }

      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');

      const goSignupBtn = document.getElementById('go-signup');
      const goLoginBtn = document.getElementById('go-login');

      const loginBtn = document.getElementById('login-btn');
      const signupBtn = document.getElementById('signup-btn');

      const loginError = document.getElementById('login-error');
      const signupError = document.getElementById('signup-error');

      // 회원가입 직후 첫 로그인인지 확인용 (첫 로그인이면 학교 등록 화면으로 보냄)
      const NEW_USER_KEY = 'wendy_new_user';

      function showLoginMessage(text, isSuccess = false) {
        loginError.textContent = text;
        loginError.classList.toggle('success', isSuccess);
      }

      // 2. [화면 전환] 회원가입 버튼 클릭했을 때
      goSignupBtn.addEventListener('click', () => {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        showLoginMessage(''); // 에러 메시지 초기화
      });

      // 3. [화면 전환] "로그인" 버튼 클릭했을 때
      goLoginBtn.addEventListener('click', () => {
        signupForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        signupError.textContent = ''; // 에러 메시지 초기화
      });

      // 4. [기능] 로그인 버튼 클릭 이벤트
      loginBtn.addEventListener('click', async () => {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;

        if (!username || !password) {
          showLoginMessage('아이디와 비밀번호를 모두 입력해주세요');
          return;
        }

        loginBtn.disabled = true;
        showLoginMessage('');
        try {
          await signIn(username, password);
        } catch (err) {
          showLoginMessage(err.message);
          loginBtn.disabled = false;
          return;
        }

        // 로그인 성공 -> 회원가입 후 첫 로그인이면 학교 등록, 아니면 메인 페이지로 이동
        if (sessionStorage.getItem(NEW_USER_KEY) === username) {
          sessionStorage.removeItem(NEW_USER_KEY);
          window.location.href = 'onboarding.html';
        } else {
          window.location.href = 'calendar.html';
        }
      });

      // 5. [기능] 회원가입 버튼 클릭 이벤트
      signupBtn.addEventListener('click', async () => {
        const username = document.getElementById('signup-username').value.trim();
        const password = document.getElementById('signup-password').value;
        const passwordConfirm = document.getElementById('signup-password-confirm').value;

        if (!username || !password || !passwordConfirm) {
          signupError.textContent = '모든 항목을 입력해주세요';
          return;
        }
        if (password.length < 6) {
          signupError.textContent = '비밀번호는 6자 이상이어야 합니다';
          return;
        }
        if (password !== passwordConfirm) {
          signupError.textContent = '비밀번호가 일치하지 않습니다';
          return;
        }

        signupBtn.disabled = true;
        signupError.textContent = '';
        try {
          await signUp(username, password);
        } catch (err) {
          signupError.textContent = err.message;
          signupBtn.disabled = false;
          return;
        }

        // 회원가입 성공 -> 로그인 화면으로 돌아가서 직접 로그인
        sessionStorage.setItem(NEW_USER_KEY, username);

        document.getElementById('signup-username').value = '';
        document.getElementById('signup-password').value = '';
        document.getElementById('signup-password-confirm').value = '';
        signupBtn.disabled = false;

        signupForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        document.getElementById('login-username').value = username;
        document.getElementById('login-password').value = '';
        document.getElementById('login-password').focus();
        showLoginMessage('회원가입이 완료됐어요. 로그인해주세요', true);
      });
    </script>

</body>

</html>
